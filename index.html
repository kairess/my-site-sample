<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taehee Lee</title>
<style>
  :root {
    --ink: #111;
    --paper: #fff;
    --mute: #777;
    --line: #e6e6e6;
    --accent: #ff4d1c;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* tabs */
  nav { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 5; }
  nav .wrap { display: flex; gap: 28px; }
  nav button {
    font: inherit; font-size: 14px; letter-spacing: .02em;
    background: none; border: 0; padding: 20px 0 16px; cursor: pointer; color: var(--mute);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  /* hero */
  .hero { padding: 120px 0 80px; }
  .hero h1 {
    font-size: clamp(56px, 13vw, 140px); line-height: .95; letter-spacing: -.04em;
    margin: 0; font-weight: 800;
  }
  .hero h1::after { content: "."; color: var(--accent); }
  .headline { font-size: clamp(20px, 3vw, 28px); margin: 32px 0 0; font-weight: 500; letter-spacing: -.01em; }
  .summary { max-width: 640px; margin: 28px 0 0; font-size: 17px; color: #333; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 32px; padding: 0; list-style: none; }
  .links a { text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
  .links a:hover { color: var(--accent); border-color: var(--accent); }

  /* sections */
  section.block { padding: 72px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 200px 1fr; gap: 24px 48px; }
  section.block > h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px 10px; margin: 0; padding: 0; list-style: none; }
  .tags li { font-size: 18px; }
  .tags li:not(:last-child)::after { content: "/"; margin-left: 10px; color: var(--accent); }

  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: grid; grid-template-columns: 150px 1fr; gap: 4px 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .rows li:first-child { padding-top: 0; }
  .rows li:last-child { border-bottom: 0; padding-bottom: 0; }
  .period { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; padding-top: 4px; }
  .rows h3 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .rows .sub { color: var(--mute); font-size: 15px; }
  .rows p { margin: 8px 0 0; color: #333; font-size: 15px; }

  /* cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { border: 1px solid var(--ink); padding: 28px; min-height: 220px; display: flex; flex-direction: column; transition: background .2s, color .2s; }
  .card:hover { background: var(--ink); color: var(--paper); }
  .card .no { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card h3 { font-size: 22px; line-height: 1.3; margin: auto 0 12px; letter-spacing: -.02em; padding-top: 40px; }
  .card p { margin: 0; font-size: 14px; opacity: .8; }

  .soon { padding: 140px 0; font-size: clamp(28px, 6vw, 48px); letter-spacing: -.03em; font-weight: 700; color: var(--mute); }
  .soon span { color: var(--accent); }

  footer { border-top: 1px solid var(--line); padding: 32px 0 56px; font-size: 13px; color: var(--mute); }
  .hidden { display: none !important; }

  /* blog */
  .page-title { font-size: clamp(40px, 9vw, 88px); line-height: 1; letter-spacing: -.04em; font-weight: 800; margin: 96px 0 48px; }
  .page-title::after { content: "."; color: var(--accent); }
  .panel { border: 1px solid var(--ink); padding: 28px; margin-bottom: 56px; }
  .panel h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .14em; color: var(--accent); }
  .panel p { margin: 0; color: var(--mute); white-space: pre-line; }
  .panel-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-top: 20px; }
  .panel-row button { font: inherit; font-size: 14px; background: var(--ink); color: var(--paper); border: 0; padding: 10px 20px; cursor: pointer; }
  .panel-row button:hover:not(:disabled) { background: var(--accent); }
  .panel-row button:disabled { opacity: .5; cursor: default; }
  .post-list { list-style: none; margin: 0 0 96px; padding: 0; }
  .post-list li { border-top: 1px solid var(--line); }
  .post-list li:last-child { border-bottom: 1px solid var(--line); }
  .post-list button { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 32px 0; cursor: pointer; }
  .post-list h3 { margin: 0; font-size: clamp(22px, 3.5vw, 30px); letter-spacing: -.02em; line-height: 1.3; }
  .post-list button:hover h3 { color: var(--accent); }
  .date { font-size: 14px; color: var(--mute); font-variant-numeric: tabular-nums; margin: 6px 0 0; }
  .excerpt { margin: 12px 0 0; color: #333; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .back { font: inherit; font-size: 14px; background: none; border: 0; padding: 0; margin: 56px 0 0; cursor: pointer; color: var(--mute); }
  .back:hover { color: var(--accent); }
  .post-view h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.15; letter-spacing: -.03em; margin: 24px 0 0; }
  .post-view .body { max-width: 640px; margin: 48px 0 96px; font-size: 17px; }
  .post-view .body p { margin: 0 0 1.4em; }

  /* guestbook */
  .gb-form { display: grid; gap: 14px; max-width: 640px; margin-bottom: 72px; }
  .gb-form input, .gb-form textarea { font: inherit; width: 100%; padding: 14px 16px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); }
  .gb-form textarea { min-height: 120px; resize: vertical; }
  .gb-form input:focus, .gb-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .gb-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .count { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .gb-form button { font: inherit; background: var(--ink); color: var(--paper); border: 0; padding: 14px 28px; cursor: pointer; }
  .gb-form button:hover { background: var(--accent); }
  .msg-err { color: var(--accent); font-size: 14px; min-height: 1.4em; margin: 0; }
  .gb-list { list-style: none; margin: 0 0 96px; padding: 0; }
  .gb-list li { border-top: 1px solid var(--line); padding: 24px 0; }
  .gb-list li:last-child { border-bottom: 1px solid var(--line); }
  .gb-list b { font-size: 17px; }
  .gb-list p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--mute); }

  @media (max-width: 720px) {
    .hero { padding: 72px 0 56px; }
    section.block { grid-template-columns: 1fr; padding: 48px 0; gap: 24px; }
    .rows li { grid-template-columns: 1fr; }
    nav .wrap { gap: 22px; }
  }
</style>

/* ───── Supabase 호출 (라이브러리 없이 fetch만 사용) ───── */
async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, {
      ...options,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
  } catch (e) {
    throw new Error("인터넷 연결을 확인한 뒤 다시 시도해 주세요.");
  }
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) throw new Error("접근이 허락되지 않았어요. 사이트 관리자에게 알려 주세요.");
    if (res.status === 404) throw new Error("데이터 저장소를 찾지 못했어요. 사이트 관리자에게 알려 주세요.");
    if (res.status === 400 || res.status === 422) throw new Error("내용이 올바르지 않아요. 입력한 내용을 확인해 주세요.");
    if (res.status === 429) throw new Error("요청이 너무 많아요. 잠시 뒤에 다시 시도해 주세요.");
    throw new Error("서버에 문제가 생겼어요. 잠시 뒤에 다시 시도해 주세요.");
  }
  return res.status === 204 ? null : res.json().catch(() => null);
}

const SUMMARY_FN_URL = SUPABASE_URL.replace("/rest/v1/", "/functions/v1/ai");
async function refreshSummary() {
  const btn = document.getElementById("summary-btn"), msg = document.getElementById("summary-msg"), txt = document.getElementById("summary-text");
  btn.disabled = true; msg.textContent = ""; btn.textContent = "요약 만드는 중…";
  try {
    const res = await fetch(SUMMARY_FN_URL, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: "{}"
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || data.error || !data.summary) throw new Error("fail");
    blogSummary = data.summary;
    txt.textContent = data.summary;
  } catch (e) {
    msg.textContent = "잠시 후 다시 시도해 주세요.";
  } finally {
    btn.disabled = false; btn.textContent = "요약 새로고침";
  }
}

function showBlogList() {
  let list;
  if (!blogLoaded && !blogError) list = `<p class="empty">불러오는 중이에요…</p>`;
  else if (blogError) list = `<p class="msg-err">글을 불러오지 못했어요. ${esc(blogError)}</p>`;
  else if (!posts.length) list = `<p class="empty">아직 글이 없어요</p>`;
  else list = `<ul class="post-list">${posts.map(p => `
      <li><button data-id="${esc(p.id)}"><h3>${esc(p.title)}</h3><p class="date">${esc(fmtDate(p.created_at))}</p><p class="excerpt">${esc(String(p.content).replace(/\s+/g, " "))}</p></button></li>`).join("")}</ul>`;
  blogEl.innerHTML = `<h1 class="page-title">블로그</h1>
    <div class="panel"><h2>최근 글 요약</h2><p id="summary-text">${blogSummary ? esc(blogSummary) : "아직 요약이 없어요"}</p>
      <div class="panel-row"><button type="button" id="summary-btn">요약 새로고침</button><span class="msg-err" id="summary-msg" role="alert"></span></div></div>${list}`;
  document.getElementById("summary-btn").addEventListener("click", refreshSummary);
  blogEl.querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => showPost(b.dataset.id)));
  window.scrollTo(0, 0);
}
function showPost(id) {
  const p = posts.find(x => String(x.id) === String(id));
  if (!p) return showBlogList();
  blogEl.innerHTML = `<button class="back" id="back">← 목록으로</button>
    <article class="post-view"><h1>${esc(p.title)}</h1><p class="date">${esc(fmtDate(p.created_at))}</p><div class="body">${paras(p.content)}</div></article>`;
  document.getElementById("back").addEventListener("click", showBlogList);
  window.scrollTo(0, 0);
}
showBlogList();
loadBlog().then(() => { if (blogEl.querySelector(".post-list, .empty, .msg-err")) showBlogList(); });

/* ───── 방명록 ───── */
const gbName = document.getElementById("gb-name"), gbMsg = document.getElementById("gb-msg");
const gbErr = document.getElementById("gb-err"), gbCount = document.getElementById("gb-count"), gbList = document.getElementById("gb-list");
const gbBtn = document.querySelector("#gb-form button");

async function loadGB() {
  gbList.innerHTML = `<li class="empty">불러오는 중이에요…</li>`;
  try {
    const rows = await api("guestbook?select=id,name,message,created_at&order=created_at.desc");
    gbList.innerHTML = rows && rows.length
      ? rows.map(e => `<li><b>${esc(e.name)}</b> <span class="date">${esc(fmtDate(e.created_at))}</span><p>${esc(e.message)}</p></li>`).join("")
      : `<li class="empty">아직 남겨진 글이 없어요. 첫 글을 남겨 주세요.</li>`;
  } catch (e) {
    gbList.innerHTML = `<li class="msg-err">방명록을 불러오지 못했어요. ${esc(e.message)}</li>`;
  }
}
gbMsg.addEventListener("input", () => { gbCount.textContent = gbMsg.value.length + " / 200"; });
document.getElementById("gb-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = gbName.value.trim(), message = gbMsg.value.trim();
  if (!name) { gbErr.textContent = "이름을 입력해 주세요."; gbName.focus(); return; }
  if (!message) { gbErr.textContent = "메시지를 입력해 주세요."; gbMsg.focus(); return; }
  if (message.length > 200) { gbErr.textContent = "메시지는 200자까지 쓸 수 있어요."; return; }
  gbErr.textContent = "";
  gbBtn.disabled = true;
  try {
    await api("guestbook", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ name, message }) });
    gbName.value = ""; gbMsg.value = ""; gbCount.textContent = "0 / 200";
    await loadGB();
  } catch (e) {
    gbErr.textContent = "글을 남기지 못했어요. " + e.message;
  } finally { gbBtn.disabled = false; }
});
loadGB();

const tabs = document.querySelectorAll("nav button");
function show(name) {
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  ["profile", "blog", "guestbook"].forEach(n => document.getElementById("tab-" + n).classList.toggle("hidden", n !== name));
  window.scrollTo(0, 0);
}
tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
</script>
